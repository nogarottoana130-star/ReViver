<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus dados | ReViver</title>
  <link rel="stylesheet" href="../static/style.css">
  <script src="../js/meus_dados.js" defer></script>
  <script src="../js/menu.js" defer></script>
</head>
<body>
  
  <header class="cabecalho">
    <div class="container flex-cabecalho">
      <div class="brand-group">
        <img src="../assets/logo.png" alt="Logo ReViver" class="logo">
        <div class="brand-text">
          <span class="marca">ReViver</span>
          <span class="subtitulo">Você não está sozinho</span>
        </div>
      </div>
      <nav class="nav-links" id="menu-principal"></nav>
      <!-- <nav class="nav-links">
        <a href="principal.html" class="link-nav">Início</a>
        <a href="meus_dados.html" class="link-nav ativo"> Meus dados</a>
      </nav> -->
    </div>
  </header>

  <main class="container">
    
    <div class="titulo-pagina">
      <p class="legenda">CADASTRO DE PERFIL</p>
      <h1>Meus dados</h1>
      <p>Confira suas informações cadastradas.</p>
    </div>

    <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

    <section class="painel">
      <div class="painel-titulo">
        <h2>Informações do meu cadastro</h2>
      </div>
    
      <div class="formulario">
        <p><strong>Nome:</strong> <span id="dado-nome"></span></p>
        <p><strong>Email:</strong> <span id="dado-email"></span></p>
        <p><strong>CPF:</strong> <span id="dado-cpf"></span></p>
        <p><strong>Telefone:</strong> <span id="dado-telefone"></span></p>
        <p>
          <strong>Data de nascimento:</strong>
          <span id="dado-nascimento"></span>
        </p>
      </div>
    </section>

    <footer class="rodape">
      ReViver © 2026 - Apoio e acolhimento. Você não está sozinho.
    </footer>
  </main>

</body>
</html>
