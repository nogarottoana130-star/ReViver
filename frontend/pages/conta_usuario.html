<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta de Usuário | ReViver</title>
  <link rel="stylesheet" href="../static/style.css">
  <script src="../js/conta_usuario.js" defer></script>
  <script src="../js/menu.js" defer></script>
</head>
<body>
  
  <header class="cabecalho">
    <div class="container flex-cabecalho">
      <div class="brand-group">
        <img src="../assets/logo.png" alt="Logo ReViver" class="logo">
        <div class="brand-text">
          <span class="marca">ReViver</span>
          <span class="subtitulo">Você não está sozinho</span>
        </div>
      </div>
      <nav class="nav-links" id="menu-principal"></nav>
      <!-- <nav class="nav-links">
        <a href="principal.html" class="link-nav">Início</a>
        <a href="conta_usuario.html" class="link-nav ativo">Criar usuário</a>
        <a href="cadastro_usuario.html" class="link-nav ativo">Voltar</a>
      </nav> -->
    </div>
  </header>

  <main class="container">
    
    <div class="titulo-pagina">
      <p class="legenda">CADASTRO DE USUÁRIO</p>
      <h1>Criar conta de usuário</h1>
      <p>Preencha os dados abaixo para começar. Um novo começo é possível. E ele começa com você.</p>
    </div>

    <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

    <section class="painel" aria-labelledby="titulo-formulario">
      <div class="painel-titulo">
        <h2 id="titulo-formulario">Dados Pessoais</h2>
        <span class="legenda">NOVO CADASTRO</span>
      </div>

      <form id="form-conta-usuario" class="formulario">
        
        <!-- Campo: nome -->
        <div class="campo-com-icone">
          <div class="icone-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="campo flex-1">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" type="text" placeholder="Digite seu nome completo" required>
          </div>
        </div>

        <!-- Campo: email -->
        <div class="campo-com-icone">
          <div class="icone-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <div class="campo flex-1">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Digite seu email" required>
          </div>
        </div>

         <!-- Campo: senha -->
         <div class="campo-com-icone">
          <div class="icone-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <div class="campo flex-1">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha"required>
          </div>
        </div>

        <!-- Campo: cpf -->
        <div class="campo-com-icone">
          <div class="icone-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          <div class="campo flex-1">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00" maxlength="14" required>
          </div>
        </div>

        <!-- Campo: telefone -->
        <div class="campo-com-icone">
          <div class="icone-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <div class="campo flex-1">
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" placeholder="(00) 00000-0000" required>
          </div>
        </div>

        <!-- Campo: data_nascimento -->
        <div class="campo-com-icone">
          <div class="icone-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <div class="campo flex-1">
            <label for="data_nascimento">Data de nascimento</label>
            <input id="data_nascimento" name="data_nascimento" type="date" required>
          </div>
        </div>

       

        <!-- Botão Principal -->
        <div class="acoes acoes-bloco">
          <button id="botao-cadastrar" class="botao botao-destaque-azul" type="submit">Cadastrar</button>
        </div>

      </form>
    </section>

    <footer class="rodape">
      ReViver © 2026 - Apoio e acolhimento. Você não está sozinho.
    </footer>
  </main>

</body>
</html>
